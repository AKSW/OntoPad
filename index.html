<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script id="ontopad_configuration" type="application/yaml">
      sources:
        - id: in_memory
          type: in_memory
          data: |
            @prefix foaf: <http://xmlns.com/foaf/0.1/> .
            @prefix ex: <http://example.org/> .
            @prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
            @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
            @prefix schema: <http://schema.org/> .
            @prefix sh: <http://www.w3.org/ns/shacl#> .
            @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .

            foaf:Person a rdf:Class .
            graph ex: {
              ex:Norman a foaf:Person ;
                schema:birthDate "1981-01-01" ;
                foaf:forname "Norman" ;
                foaf:name "Radtke" .
              ex:Natanael a foaf:Person ;
                foaf:name "Natanael" .
              ex:Sascha a foaf:Person ;
                foaf:name "Sascha" ;
                foaf:knows ex:Norman, ex:Natanael .
              ex:PersonShape a sh:NodeShape ;
                rdfs:label "A NodeShape for persons"@en ;
                sh:targetClass foaf:Person ;
                sh:property [
                  sh:path foaf:forname ;
                  sh:minCount 1 ;
                  sh:maxCount 4 ;
                  sh:minLength 1 ;
                  sh:maxLength 20 ;
                  sh:datatype xsd:string ;
                ] ;
                sh:property [
                  sh:path schema:birthDate ;
                  rdfs:comment "The birthdate is expected as follows YYYY-MM-DD" ;
                  sh:minCount 1 ;
                  sh:maxCount 1 ;
                  sh:datatype xsd:date ;
                ] ;
                sh:property [
                  sh:path schema:affiliation ;
                  sh:minCount 0 ;
                  sh:nodeKind sh:IRI ;
                ] ;
                sh:property [
                  sh:path foaf:knows ;
                  sh:minCount 0 ;
                  sh:nodeKind sh:IRI ;
                ] ;
                sh:property [
                  sh:path foaf:name ;
                  sh:minCount 1 ;
                  sh:maxCount 2 ;
                  sh:datatype xsd:string ;
                ] .
            }
        - id: local_quitstore
          type: endpoint
          quit_url: http://localhost:5000
      graph_iri: http://example.org/
      resource_iri: http://example.org/Resource
    </script>
    <title>Vite App</title>

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
